name: Update projects

on:
  schedule:
    - cron: '23 11 * * *'   # daily at 11:23 UTC
  workflow_dispatch:          # lets you run it from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            {
              user(login: "bcurran2") {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name
                      description
                      url
                      homepageUrl
                      pushedAt
                      repositoryTopics(first: 12) { nodes { topic { name } } }
                    }
                  }
                }
              }
            }' --jq '
              .data.user.pinnedItems.nodes
              | map(select(.name != "bcurran2" and .name != "bcurran2.github.io"))
              | map({
                  name: .name,
                  description: .description,
                  url: .url,
                  homepage: .homepageUrl,
                  topics: [.repositoryTopics.nodes[].topic.name]
                })
              | {projects: .}' > projects.json
          cat projects.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          if git diff --cached --quiet; then
            echo "No changes to projects.json"
          else
            git commit -m "Update projects from pinned repositories"
            git push
          fi
